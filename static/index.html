<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Energy Transition Dashboard · GEM Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">GEM</div>
      <div>
        <h1>Global Energy Transition Dashboard</h1>
        <p class="subtitle">Energy trackers · World Ports · Live AIS · Sea routes</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-upload" class="btn btn-orange">⬆ Upload</button>
      <button id="btn-export" class="btn btn-teal">⬇ Export Excel</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Trackers</h3>
      <div id="tracker-list" class="tracker-list"></div>

      <h3 style="margin-top:1.25rem">Filters</h3>
      <div class="filter-group">
        <label>Status</label>
        <div class="dd" id="dd-status">
          <button type="button" class="dd-btn" id="dd-status-btn">Select status…</button>
          <div class="dd-panel" id="dd-status-panel"></div>
        </div>
      </div>
      <div class="filter-group">
        <label>Country <span class="hint">(top 20 by capacity first)</span></label>
        <div class="dd" id="dd-country">
          <button type="button" class="dd-btn" id="dd-country-btn">Select countries…</button>
          <div class="dd-panel" id="dd-country-panel"></div>
        </div>
      </div>
      <div class="filter-group">
        <label>Capacity</label>
        <div class="range-row">
          <input type="number" id="filter-min-mw" placeholder="Min" />
          <input type="number" id="filter-max-mw" placeholder="Max" />
        </div>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="filter-search" placeholder="Plant / Owner / Port…" />
      </div>
      <button id="btn-apply" class="btn btn-teal full">Apply Filters</button>
      <button id="btn-reset" class="btn btn-ghost full">Reset</button>

      <div class="tools-box">
        <h3>Live AIS vessels</h3>
        <input type="password" id="ais-key" placeholder="AISStream API key" />
        <button id="btn-ais" class="btn btn-teal full">Connect AIS</button>
        <p class="hint" id="ais-status">Key from aisstream.io (free with GitHub)</p>
      </div>

      <div class="tools-box">
        <h3>Sea route distance</h3>
        <div class="range-row">
          <input type="number" id="route-from-lat" step="any" placeholder="From lat" />
          <input type="number" id="route-from-lon" step="any" placeholder="From lon" />
        </div>
        <div class="range-row">
          <input type="number" id="route-to-lat" step="any" placeholder="To lat" />
          <input type="number" id="route-to-lon" step="any" placeholder="To lon" />
        </div>
        <button id="btn-route" class="btn btn-orange full">Calculate route</button>
        <p class="hint" id="route-result">Click two ports on the map, or enter coordinates</p>
      </div>
    </aside>

    <main class="main">
      <section id="kpi-strip" class="kpi-strip"></section>
      <div class="view-tabs">
        <button class="tab active" data-view="map">🗺 Map</button>
        <button class="tab" data-view="table">📋 Table</button>
        <button class="tab" data-view="chat">💬 Ask Grok</button>
      </div>
      <div id="view-map" class="view active"><div id="map"></div></div>
      <div id="view-table" class="view">
        <div class="table-wrap"><table id="data-table"><thead></thead><tbody></tbody></table></div>
        <div class="table-footer">
          <span id="table-info"></span>
          <div>
            <button id="btn-prev" class="btn btn-ghost">← Prev</button>
            <button id="btn-next" class="btn btn-ghost">Next →</button>
          </div>
        </div>
      </div>
      <div id="view-chat" class="view">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <label class="chk"><input type="checkbox" id="use-local-llm" /> Local LLM</label>
          <input type="text" id="local-llm-url" placeholder="http://localhost:1234/v1" style="display:none" />
          <input type="text" id="chat-input" placeholder="Ask about capacity, countries, routes…" />
          <button id="btn-send" class="btn btn-teal">Send</button>
        </div>
      </div>
    </main>
  </div>

  <div id="upload-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Upload data</h2>
      <p>Excel, CSV or JSON</p>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv,.json" />
      <p id="upload-status"></p>
      <div class="modal-actions">
        <button id="btn-cancel-upload" class="btn btn-ghost">Cancel</button>
        <button id="btn-do-upload" class="btn btn-orange">Upload</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
