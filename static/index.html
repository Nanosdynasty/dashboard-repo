<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Energy Transition Dashboard · GEM Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">GEM</div>
      <div>
        <h1>Global Energy Transition Dashboard</h1>
        <p class="subtitle">Energy · Vessels · Ports · Sea routes</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-upload" class="btn btn-orange">⬆ Upload</button>
      <button id="btn-export" class="btn btn-teal">⬇ Export Excel</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="nav-group" id="group-energy">
        <button type="button" class="nav-group-header" data-group="energy">
          <span>⚡ Energy</span><span class="chev">▾</span>
        </button>
        <div class="nav-group-body">
          <div id="tracker-list" class="tracker-list"></div>
          <h4 class="sub-h">Filters</h4>
          <div class="filter-group">
            <label>Status</label>
            <div class="dd" id="dd-status">
              <button type="button" class="dd-btn" id="dd-status-btn">Select status…</button>
              <div class="dd-panel" id="dd-status-panel"></div>
            </div>
          </div>
          <div class="filter-group">
            <label>Country <span class="hint">(by capacity)</span></label>
            <div class="dd" id="dd-country">
              <button type="button" class="dd-btn" id="dd-country-btn">Select countries…</button>
              <div class="dd-panel" id="dd-country-panel"></div>
            </div>
          </div>
          <div class="filter-group">
            <label>Capacity</label>
            <div class="range-row">
              <input type="number" id="filter-min-mw" placeholder="Min" />
              <input type="number" id="filter-max-mw" placeholder="Max" />
            </div>
          </div>
          <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filter-search" placeholder="Plant / Owner…" />
          </div>
          <button id="btn-apply" class="btn btn-teal full">Apply Filters</button>
          <button id="btn-reset" class="btn btn-ghost full">Reset</button>
        </div>
      </div>
      <div class="nav-group open" id="group-vessels">
        <button type="button" class="nav-group-header" data-group="vessels">
          <span>🚢 Vessels</span><span class="chev">▾</span>
        </button>
        <div class="nav-group-body">
          <div id="vessel-tracker-list" class="tracker-list"></div>
          <div class="tools-box">
            <h3>Distance calculator</h3>
            <label class="hint">From port</label>
            <input type="text" id="port-from-search" list="port-list" placeholder="Search port name…" autocomplete="off" />
            <input type="hidden" id="route-from-lat" />
            <input type="hidden" id="route-from-lon" />
            <p class="hint" id="port-from-label">—</p>
            <label class="hint">To port</label>
            <input type="text" id="port-to-search" list="port-list" placeholder="Search port name…" autocomplete="off" />
            <input type="hidden" id="route-to-lat" />
            <input type="hidden" id="route-to-lon" />
            <p class="hint" id="port-to-label">—</p>
            <datalist id="port-list"></datalist>
            <div class="range-row" style="margin-top:0.4rem">
              <input type="number" id="route-speed" value="12" step="0.5" min="5" max="25" title="Speed knots" />
              <span class="hint" style="align-self:center">kn</span>
            </div>
            <button id="btn-route" class="btn btn-orange full">Calculate route</button>
            <p class="hint" id="route-result">Select two ports by name</p>
          </div>
          <div class="tools-box">
            <h3>Track vessel by IMO / MMSI</h3>
            <p class="hint">Paste ship IDs to fetch current position (AIS ~25s).</p>
            <textarea id="imo-list" rows="4" placeholder="MMSI or IMO, one per line"></textarea>
            <button id="btn-track-imo" class="btn btn-orange full">Find these vessels</button>
            <button id="btn-clear-imo" class="btn btn-ghost full">Clear vessels from map</button>
            <p class="hint" id="imo-status">Paste IDs then click Find</p>
            <div id="vessel-results" class="vessel-results"></div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <section id="kpi-strip" class="kpi-strip"></section>
      <div class="view-tabs">
        <button class="tab active" data-view="map">🗺 Map</button>
        <button class="tab" data-view="table">📋 Table</button>
        <button class="tab" data-view="chat">💬 Ask Grok</button>
      </div>
      <div id="view-map" class="view active"><div id="map"></div></div>
      <div id="view-table" class="view">
        <div class="table-wrap"><table id="data-table"><thead></thead><tbody></tbody></table></div>
        <div class="table-footer">
          <span id="table-info"></span>
          <div>
            <button id="btn-prev" class="btn btn-ghost">← Prev</button>
            <button id="btn-next" class="btn btn-ghost">Next →</button>
          </div>
        </div>
      </div>
      <div id="view-chat" class="view">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <label class="chk"><input type="checkbox" id="use-local-llm" /> Local LLM</label>
          <input type="text" id="local-llm-url" placeholder="http://localhost:1234/v1" style="display:none" />
          <input type="text" id="chat-input" placeholder="Ask about capacity, ports, routes…" />
          <button id="btn-send" class="btn btn-teal">Send</button>
        </div>
      </div>
    </main>
  </div>
  <div id="upload-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Upload data</h2>
      <p>Excel, CSV or JSON</p>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv,.json" />
      <p id="upload-status"></p>
      <div class="modal-actions">
        <button id="btn-cancel-upload" class="btn btn-ghost">Cancel</button>
        <button id="btn-do-upload" class="btn btn-orange">Upload</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/app-map.js"></script>
</body>
</html>
